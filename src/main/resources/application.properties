quarkus.application.name=integra-service
quarkus.http.port=8080

quarkus.datasource.db-kind=postgresql
quarkus.jooq.dialect=POSTGRES

quarkus.flyway.migrate-at-start=true

quarkus.smallrye-openapi.info-title=Integra Service API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true

# Prod uses the docker-compose Postgres. Dev/test use Quarkus Dev Services.
%prod.quarkus.datasource.username=integra
%prod.quarkus.datasource.password=integra
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/integra
